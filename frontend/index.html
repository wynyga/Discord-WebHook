<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies a stored theme override before first paint; everything else loads later. -->
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem('color-scheme') ?? 'light dark';
      } catch {}
    </script>
    <meta name="description" content="Schedule messages to Discord channels and watch every delivery." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Task Scheduler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
